<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>충북대학교 스포츠센터 인바디 예약</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        cbnu: {
                            DEFAULT: '#8a1538', // 충북대 상징색 (버건디)
                            light: '#a62b4e',
                            dark: '#6b0f2a',
                        },
                        gold: '#cfb53b'
                    }
                }
            }
        }
    </script>
    <style>
        /* 커스텀 스크롤바 가리기 (모바일 친화적) */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 토스트 애니메이션 */
        @keyframes slideInUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen overflow-hidden flex justify-center">

    <!-- 모바일 앱 컨테이너 -->
    <div class="w-full max-w-md h-full bg-white relative shadow-2xl flex flex-col">
        
        <!-- Login Screen -->
        <div id="login-screen" class="flex flex-col h-full w-full bg-white justify-center items-center p-6 absolute inset-0 z-50">
            <div class="mb-10 text-center w-full">
                <div class="w-20 h-20 bg-cbnu rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="ph-fill ph-barbell text-4xl text-gold"></i>
                </div>
                <h1 id="login-title-text" class="text-2xl font-bold text-gray-800">인바디 예약 시스템</h1>
                <p class="text-sm text-gray-500 mt-1">충북대학교 스포츠센터</p>
            </div>
            
            <!-- 일반 사용자 로그인 폼 -->
            <form id="user-login-form" onsubmit="handleLogin(event)" class="w-full max-w-sm space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">이름</label>
                    <input type="text" id="login-name" placeholder="이름을 입력하세요" required
                           class="w-full px-4 py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-cbnu focus:border-cbnu outline-none transition text-sm bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">전화번호</label>
                    <input type="tel" id="login-phone" placeholder="숫자만 입력하세요 (예: 01012345678)" required pattern="[0-9]+" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                           class="w-full px-4 py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-cbnu focus:border-cbnu outline-none transition text-sm bg-gray-50">
                </div>
                <div class="flex items-center gap-2 mt-2 px-1">
                    <input type="checkbox" id="privacy-consent" required class="w-4 h-4 text-cbnu border-gray-300 rounded focus:ring-cbnu">
                    <label for="privacy-consent" class="text-[11px] text-gray-600 cursor-pointer">[필수] 개인정보 수집 및 이용 동의 (인바디 관리 목적)</label>
                </div>
                <button type="submit" class="w-full bg-cbnu text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-cbnu-light transition mt-4">
                    로그인
                </button>
            </form>

            <!-- 관리자 로그인 폼 -->
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="w-full max-w-sm space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">사번</label>
                    <input type="text" id="admin-id" placeholder="사번을 입력하세요" required
                           class="w-full px-4 py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:border-gray-800 outline-none transition text-sm bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">비밀번호</label>
                    <input type="password" id="admin-pw" placeholder="비밀번호를 입력하세요" required
                           class="w-full px-4 py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:border-gray-800 outline-none transition text-sm bg-gray-50">
                </div>
                <button type="submit" class="w-full bg-gray-800 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-gray-700 transition mt-4">
                    관리자 로그인
                </button>
            </form>
            
            <div class="mt-8 flex gap-4 text-sm text-gray-400 font-medium">
                <button id="mode-toggle-btn" type="button" onclick="toggleLoginMode()" class="hover:text-cbnu transition underline underline-offset-2">관리자 권한으로 로그인</button>
            </div>
        </div>

        <!-- App Screen -->
        <div id="app-screen" class="hidden flex-col h-full w-full relative bg-gray-50">
            <!-- Header -->
            <header id="app-header" class="bg-cbnu text-white p-4 flex justify-between items-center shadow-md z-10 shrink-0 transition-colors">
                <!-- Content injected via JS based on role -->
            </header>

            <!-- Main Content Area -->
            <main id="main-content" class="flex-1 overflow-y-auto w-full relative pb-20">
                <!-- Content injected here -->
            </main>

            <!-- User Bottom Navigation -->
            <nav id="bottom-nav" class="bg-white border-t border-gray-200 flex justify-around p-2 pb-safe absolute bottom-0 w-full z-10 shrink-0">
                <button onclick="switchTab('home')" data-tab="home" class="tab-btn flex flex-col items-center p-2 text-cbnu w-full">
                    <i class="ph ph-house text-2xl mb-1"></i>
                    <span class="text-[10px] font-medium">홈</span>
                </button>
                <button onclick="switchTab('reserve')" data-tab="reserve" class="tab-btn flex flex-col items-center p-2 text-gray-400 w-full">
                    <i class="ph ph-calendar-plus text-2xl mb-1"></i>
                    <span class="text-[10px] font-medium">예약하기</span>
                </button>
                <button onclick="switchTab('my')" data-tab="my" class="tab-btn flex flex-col items-center p-2 text-gray-400 w-full">
                    <i class="ph ph-user text-2xl mb-1"></i>
                    <span class="text-[10px] font-medium">내 정보</span>
                </button>
            </nav>

            <!-- Admin Bottom Navigation -->
            <nav id="admin-bottom-nav" class="bg-white border-t border-gray-200 hidden justify-around p-2 pb-safe absolute bottom-0 w-full z-10 shrink-0">
                <button class="flex flex-col items-center p-2 text-cbnu w-full">
                    <i class="ph ph-calendar-check text-2xl mb-1"></i>
                    <span class="text-[10px] font-medium">예약 관리 현황</span>
                </button>
            </nav>
        </div> <!-- End of App Screen -->

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg text-sm hidden z-50 flex items-center gap-2 max-w-[90%]">
            <i class="ph-fill ph-bell-ringing text-gold text-lg"></i>
            <span id="toast-message">알림 메시지</span>
        </div>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 items-center justify-center p-4">
            <div id="modal-content" class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-200">
                <!-- Modal Body will be injected here -->
            </div>
        </div>

    </div>

    <script>
        // --- State Management ---
        const AppState = {
            isLoggedIn: false,
            role: 'user', // 'user' or 'admin'
            currentTab: 'home',
            selectedDate: getLocalYYYYMMDD(new Date()), // 데모를 위해 오늘 날짜를 기본값으로 설정
            hasNotification: false,
            notifications: [], 
            remindersSent: [], 
            modifyingReservation: null, // 예약 변경 시 기존 예약 정보를 담는 변수
            
            currentUser: {
                id: 'user123',
                name: '김충북',
                studentId: '2023000123',
                phone: '01012345678'
            },

            history: [
                { date: '2026-08-10', weight: 75.2, muscle: 33.1, fatPercent: 22.4, bmi: 24.5, score: 74, bmr: 1620 },
                { date: '2026-09-12', weight: 74.5, muscle: 33.5, fatPercent: 21.0, bmi: 24.1, score: 76, bmr: 1650 },
                { date: '2026-10-15', weight: 73.8, muscle: 34.2, fatPercent: 19.5, bmi: 23.8, score: 79, bmr: 1690 }
            ],

            // db 구조 개선: bookingStatus(예약상태), measureStatus(측정상태) 분리
            db: {},
            equipmentStatus: 'available'
        };
        
        let fatChartInstance = null;

        // --- Utility Functions ---
        function maskPhoneNumber(phone) {
            if (!phone || phone.length < 10) return phone || '';
            return phone.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-****-$3');
        }

        function getLocalYYYYMMDD(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTomorrowDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            if(tomorrow.getDay() === 6) tomorrow.setDate(tomorrow.getDate() + 2);
            if(tomorrow.getDay() === 0) tomorrow.setDate(tomorrow.getDate() + 1);
            return getLocalYYYYMMDD(tomorrow);
        }

        function getDayName(dateStr) {
            const date = new Date(dateStr);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return days[date.getDay()];
        }

        // 공휴일 지정 (예시)
        const holidays = ['2026-12-25', '2027-01-01', '2027-03-01'];

        function isHolidayOrWeekend(dateStr) {
            const date = new Date(dateStr);
            const day = date.getDay();
            if (day === 0 || day === 6) return true;
            if (holidays.includes(dateStr)) return true;
            return false;
        }

        function generateTimeSlots() {
            const slots = [];
            for (let h = 6; h <= 20; h++) {
                const hour = h.toString().padStart(2, '0');
                slots.push(`${hour}:00`);
                if (h !== 20) slots.push(`${hour}:30`);
            }
            return slots;
        }

        const timeSlots = generateTimeSlots();

        function getOrCreateDayData(dateStr) {
            if (!AppState.db[dateStr]) {
                AppState.db[dateStr] = {};
            }
            return AppState.db[dateStr];
        }

        // --- 관리자 화면 설명을 위한 가상 데이터(Mock DB) 주입 ---
        function initMockDB() {
            const todayStr = getLocalYYYYMMDD(new Date());
            AppState.db[todayStr] = {
                "09:00": { bookingStatus: '예약완료', measureStatus: '측정완료', userId: 'other1', userName: '김철수', phone: '01011112222', waitlist: [] },
                "09:30": { bookingStatus: '예약완료', measureStatus: '불참', userId: 'other2', userName: '이영희', phone: '01033334444', waitlist: [] },
                "10:00": { bookingStatus: '취소', measureStatus: '-', userId: 'other3', userName: '박민수', phone: '01055556666', waitlist: [] },
                "10:30": { bookingStatus: '변경', measureStatus: '-', userId: 'other4', userName: '최지우', phone: '01077778888', waitlist: [] },
                "14:00": { bookingStatus: '예약완료', measureStatus: '측정대기', userId: 'other5', userName: '정다운', phone: '01099990000', waitlist: [{userId: 'dummy', userName: '대기자1', phone: '01012341234'}] },
                "18:00": { bookingStatus: '예약완료', measureStatus: '측정대기', userId: 'other6', userName: '강해린', phone: '01088889999', waitlist: [] }
            };
        }

        // --- Authentication ---
        let currentLoginMode = 'user';

        function toggleLoginMode() {
            const userForm = document.getElementById('user-login-form');
            const adminForm = document.getElementById('admin-login-form');
            const toggleBtn = document.getElementById('mode-toggle-btn');
            const titleText = document.getElementById('login-title-text');

            if (currentLoginMode === 'user') {
                currentLoginMode = 'admin';
                userForm.classList.add('hidden');
                adminForm.classList.remove('hidden');
                toggleBtn.innerText = '일반 사용자로 로그인';
                titleText.innerText = '관리자 시스템';
            } else {
                currentLoginMode = 'user';
                adminForm.classList.add('hidden');
                userForm.classList.remove('hidden');
                toggleBtn.innerText = '관리자 권한으로 로그인';
                titleText.innerText = '인바디 예약 시스템';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const consent = document.getElementById('privacy-consent').checked;
            if (!consent) {
                alert("개인정보 수집 및 이용에 동의해야 서비스를 이용할 수 있습니다.");
                return;
            }
            
            const name = document.getElementById('login-name').value;
            const phone = document.getElementById('login-phone').value;
            
            AppState.currentUser.name = name;
            AppState.currentUser.phone = phone;
            AppState.currentUser.id = `user_${phone.replace(/[^0-9]/g, '')}`; 
            
            AppState.role = 'user';
            AppState.selectedDate = getTomorrowDate(); // 사용자는 내일 날짜가 기본
            completeLogin();
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const adminId = document.getElementById('admin-id').value;
            const adminPw = document.getElementById('admin-pw').value;
            
            if (adminId && adminPw) {
                AppState.role = 'admin';
                AppState.selectedDate = getLocalYYYYMMDD(new Date()); // 관리자는 오늘 날짜가 기본
                completeLogin();
            }
        }

        function completeLogin() {
            AppState.isLoggedIn = true;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('flex');
            
            if(AppState.notifications.length === 0 && AppState.role === 'user') {
                 addNotification("충북대학교 인바디 예약 앱에 오신 것을 환영합니다.");
            }
            
            const header = document.getElementById('app-header');
            
            if (AppState.role === 'admin') {
                header.className = 'bg-[#1a1f2b] text-white p-4 flex justify-between items-center shadow-md z-10 shrink-0';
                header.innerHTML = `
                    <div>
                        <h1 class="font-bold text-lg tracking-tight">운영자 통합 대시보드</h1>
                        <p class="text-[10px] text-gray-400 mt-0.5">충북대 체육진흥원 행정실 / 지도자</p>
                    </div>
                    <button onclick="promptLogout()" class="bg-white/10 border border-white/20 text-gray-200 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                        로그아웃
                    </button>
                `;
                document.getElementById('bottom-nav').style.display = 'none';
                document.getElementById('admin-bottom-nav').style.display = 'flex';
                renderAdminDashboard();
            } else {
                header.className = 'bg-cbnu text-white p-4 flex justify-between items-center shadow-md z-10 shrink-0';
                header.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i id="role-icon" class="ph ph-house text-2xl"></i>
                        <h1 class="font-bold text-lg">스포츠센터 인바디</h1>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="openNotificationCenter()" class="relative" title="알림">
                            <i class="ph ph-bell text-2xl hover:text-gray-200 transition"></i>
                            <span id="notif-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full hidden shadow-sm border border-cbnu">0</span>
                        </button>
                        <button onclick="promptLogout()" class="bg-white/10 border border-white/20 text-white hover:bg-white/20 px-3 py-1.5 rounded-lg text-xs font-medium transition" title="로그아웃">
                            로그아웃
                        </button>
                    </div>
                `;
                updateNotificationBadge();
                document.getElementById('bottom-nav').style.display = 'flex';
                document.getElementById('admin-bottom-nav').style.display = 'none';
                switchTab('home');
            }
        }

        function promptLogout() {
            const modalHtml = `
                <div class="p-6 text-center">
                    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-600">
                        <i class="ph-duotone ph-sign-out text-3xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-gray-800 mb-2">로그아웃 하시겠습니까?</h2>
                    <p class="text-sm text-gray-500 mb-6">로그아웃 시 로그인 화면으로 이동합니다.</p>
                    <div class="flex gap-2">
                        <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300 transition">취소</button>
                        <button onclick="confirmLogout()" class="flex-1 bg-cbnu text-white py-3 rounded-lg font-bold hover:bg-cbnu-light shadow-md transition">로그아웃</button>
                    </div>
                </div>
            `;
            openModal(modalHtml);
        }

        function confirmLogout() {
            closeModal();
            AppState.isLoggedIn = false;
            AppState.modifyingReservation = null;
            
            document.getElementById('login-name').value = '';
            document.getElementById('login-phone').value = '';
            document.getElementById('admin-id').value = '';
            document.getElementById('admin-pw').value = '';
            
            document.getElementById('app-screen').classList.remove('flex');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            
            if(currentLoginMode === 'admin') {
                toggleLoginMode();
            }
            
            showToast("로그아웃 되었습니다.");
        }

        // --- Core Functions ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');
            
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 3000);
        }

        function openModal(htmlContent) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }, 200);
        }

        // --- Notifications ---
        function addNotification(message) {
            const notifId = Date.now();
            AppState.notifications.unshift({
                id: notifId,
                message: message,
                time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
                read: false
            });
            updateNotificationBadge();
            return notifId;
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notif-badge');
            if(!badge) return;
            const unreadCount = AppState.notifications.filter(n => !n.read).length;
            if(unreadCount > 0) {
                badge.innerText = unreadCount > 9 ? '9+' : unreadCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openNotificationCenter() {
            let listHtml = AppState.notifications.map(n => `
                <div class="p-4 border-b border-gray-100 last:border-0 ${n.read ? 'bg-white' : 'bg-red-50'}">
                    <p class="text-sm text-gray-800 font-medium leading-snug">${n.message}</p>
                    <p class="text-[10px] text-gray-400 mt-2">${n.time}</p>
                </div>
            `).join('');

            if(AppState.notifications.length === 0) {
                listHtml = `<div class="p-10 flex flex-col items-center justify-center text-gray-400">
                                <i class="ph-duotone ph-bell-slash text-4xl mb-2"></i>
                                <span class="text-sm">새로운 알림이 없습니다.</span>
                            </div>`;
            }

            const modalHtml = `
                <div class="flex flex-col max-h-[70vh]">
                    <div class="p-4 border-b flex justify-between items-center bg-gray-50 shrink-0 rounded-t-xl">
                        <h2 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                            <i class="ph-fill ph-bell-ringing text-cbnu"></i> 알림 모음
                        </h2>
                        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-800 bg-gray-200 w-8 h-8 rounded-full flex items-center justify-center transition">
                            <i class="ph ph-x text-lg"></i>
                        </button>
                    </div>
                    <div class="overflow-y-auto flex-1 bg-white rounded-b-xl">
                        ${listHtml}
                    </div>
                </div>
            `;
            openModal(modalHtml);
            
            AppState.notifications.forEach(n => n.read = true);
            updateNotificationBadge();
        }

        function handleDateChange(e) {
            const [y, m, d] = e.target.value.split('-');
            const selectedStr = `${y}-${m}-${d}`;
            
            if(AppState.role === 'user') {
                if(isHolidayOrWeekend(selectedStr)) {

                    return;

                const today = new Date();

        function confirmReservation(time) {
            const date = AppState.selectedDate;
            if(!AppState.db[date]) AppState.db[date] = {};
            
            // 기존 예약을 변경하는 경우 기존 슬롯 취소 처리
            if (AppState.modifyingReservation) {
                const oldDate = AppState.modifyingReservation.date;
                const oldTime = AppState.modifyingReservation.time;
                if (AppState.db[oldDate] && AppState.db[oldDate][oldTime]) {
                    AppState.db[oldDate][oldTime].bookingStatus = '변경'; // 상태를 '변경'으로 남김

        // 대기자 자동 승급 및 미확인 재알림 로직
        function handleAutoPromotion(date, time) {
            const slot = AppState.db[date][time];
            if (slot && slot.waitlist && slot.waitlist.length > 0) {
                const nextUser = slot.waitlist.shift();
                
                // 기존 예약이 덮어씌워지는 구조이므로, 취소/변경된 이전 이력은 
                // 로그(히스토리) 테이블이 없으면 화면에서 사라지게 됩니다.
                // 여기서는 시연을 위해 가장 앞선 대기자가 해당 슬롯을 차지하도록 오버라이트 합니다.
                
                // 만약 대기자가 다른 시간대의 예약을 "변경"하기 위해 대기를 걸었던 경우,
                // 여기서 확정되면서 그 회원의 예전 예약 시간도 취소 처리해야 함.
                if (nextUser.modifyingFrom) {
                    const oldD = nextUser.modifyingFrom.date;
                    const oldT = nextUser.modifyingFrom.time;
                    if(AppState.db[oldD] && AppState.db[oldD][oldT]) {
                        AppState.db[oldD][oldT].bookingStatus = '변경';
                        AppState.db[oldD][oldT].measureStatus = '-';
                        // 재귀호출을 방지하기 위해 setTimeout 사용
                        setTimeout(() => handleAutoPromotion(oldD, oldT), 0);
                    }
                }

                AppState.db[date][time] = {
                    bookingStatus: '예약완료',
                    measureStatus: '측정대기',
                    userId: nextUser.userId,
                    userName: nextUser.userName,
                    phone: nextUser.phone,
                    waitlist: slot.waitlist // 남은 대기자 유지
                };
                
                if (nextUser.userId === AppState.currentUser.id) {
                    const notifId = addNotification(`🎉 대기 중이던 [${date} ${time}] 예약이 자동 확정되었습니다!`);
                    
                    setTimeout(() => {
                        const targetNotif = AppState.notifications.find(n => n.id === notifId);
                        if (targetNotif && !targetNotif.read) {
                            addNotification(`❗ [일정 재확인 요망] 빈 자리가 생겨 ${date} ${time} 예약이 확정되었습니다. 앱에 접속하여 일정을 확인해주세요.`);
                        }
                    }, 60 * 60 * 1000); 
                }
            }
        }

        function switchTab(tabId) {
            AppState.currentTab = tabId;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-cbnu');
                } else {
                    btn.classList.add('text-gray-400');
                    btn.classList.remove('text-cbnu');
                }
            });
            
            const icon = document.getElementById('role-icon');
            if (icon) {
                if (tabId === 'home') icon.className = 'ph ph-house text-2xl';
                else if (tabId === 'reserve') icon.className = 'ph ph-calendar-plus text-2xl';
                else if (tabId === 'my') icon.className = 'ph ph-user text-2xl';
            }

            if(tabId === 'home') renderUserHomeTab();
            else if(tabId === 'reserve') renderUserReserveTab();
            else if(tabId === 'my') renderUserMyTab();
        }

            if (AppState.modifyingReservation) {

                </div>
                <div class="p-4 relative">
            `;

            if(AppState.equipmentStatus === 'unavailable') {
                html += `
                    <div class="absolute inset-0 bg-white/70 z-10 backdrop-blur-[1px] flex flex-col items-center justify-center p-6 text-center">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-3 shadow-inner">
                            <i class="ph-duotone ph-wrench text-3xl text-gray-500"></i>
                        </div>

            html += `
                    <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-1">
                        <i class="ph ph-clock text-cbnu text-lg"></i> 시간 선택
                    </h3>
                    <div class="grid grid-cols-3 gap-2">
            `;

            const todayData = getOrCreateDayData(AppState.selectedDate);

            timeSlots.forEach(time => {
                const slot = todayData[time];
                
                // 해당 슬롯이 완전히 비었거나, '취소'/'변경' 상태라서 덮어써도 되는 경우 빈자리로 판단
                const isAvailable = !slot || slot.bookingStatus === '취소' || slot.bookingStatus === '변경';
                
                let btnClass = "bg-white border border-gray-200 text-gray-700 hover:border-cbnu hover:text-cbnu";
                let text = time;
                let subText = "예약가능";
                let onclick = `promptReservation('${time}')`;
                let isMyBooking = false;
                let isMyWaitlist = false;

                if (!isAvailable) {
                    if (slot.userId === AppState.currentUser.id) {
                        btnClass = "bg-cbnu border-cbnu text-white shadow-md";
                        subText = "내 예약";
                        onclick = ``; 
                        isMyBooking = true;
                    } else {
                        isMyWaitlist = slot.waitlist && slot.waitlist.some(w => w.userId === AppState.currentUser.id);
                        if(isMyWaitlist) {
                            btnClass = "bg-yellow-100 border-yellow-300 text-yellow-800";
                            subText = "대기중";
                            onclick = ``;
                        } else {

                            onclick = `promptWaitlist('${time}')`;

        // --- 내 정보 탭 부가 기능 (차트 및 상세 기록 관리) ---
        function drawFatChart() {
            const ctx = document.getElementById('fatChart');
            if (!ctx) return;

            // 기존 차트가 있다면 파괴(재렌더링 시 겹침 방지)
            if (fatChartInstance) {
                fatChartInstance.destroy();
            }
            
            // Datalabels 플러그인 등록
            Chart.register(ChartDataLabels);

            const dates = AppState.history.map(h => h.date.substring(5)); // MM-DD
            const fatData = AppState.history.map(h => h.fatPercent);

            fatChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: '체지방률 (%)',
                        data: fatData,
                        borderColor: '#8a1538',
                        backgroundColor: 'rgba(138, 21, 56, 0.1)',
                        borderWidth: 2,
                        pointBackgroundColor: '#8a1538',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            align: 'top',
                            color: '#8a1538',
                            font: { weight: 'bold', size: 10 },
                            formatter: function(value) { return value + '%'; }
                        }
                    },
                    scales: {
                        y: {
                            min: Math.floor(Math.min(...fatData)) - 2,
                            max: Math.ceil(Math.max(...fatData)) + 2,
                            grid: { color: '#f3f4f6' },
                            ticks: { font: { size: 10 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function renderAdminDashboard() {
            const main = document.getElementById('main-content');

            let htmlList = '';
            
            // 현재 시간을 바탕으로 '측정 시간' 경과 여부 확인을 위한 기준 시간

            timeSlots.forEach(time => {
                const slot = todayData[time];
                if(slot && slot.bookingStatus) {
                    
                    const isCancelledOrChanged = slot.bookingStatus === '취소' || slot.bookingStatus === '변경';
                    
                    // 예약 상태 뱃지

                                    <span class="text-[9px] text-gray-400 tracking-tighter">${maskPhoneNumber(slot.phone)}</span>
                                </div>
                            </div>
                            
                            <!-- 예약 상태 (2칸) -->
                            <div class="col-span-2 text-center flex justify-center">
                                ${bookBadge}
                            </div>

                            <!-- 측정 상태 (2칸) -->
                            <div class="col-span-2 text-center flex justify-center">
                                ${msrBadge}
                            </div>

                            <!-- 관리 (3칸) -->
                            <div class="col-span-3 flex justify-end">
                                ${actionButtons}
                            </div>
                        </div>
                    `;
                }
            });

            if(htmlList === '') {
                htmlList = `<p class="text-xs text-gray-400 text-center py-8">해당 날짜에 등록된 이력이 없습니다.</p>`;
            }

            const isEquipAvailable = AppState.equipmentStatus === 'available';

            main.innerHTML = `
                <div class="bg-gray-50 min-h-full p-4 pb-20">
                    <div class="mb-4 flex justify-between items-end">
                        <div>
                            <h2 class="font-bold text-gray-800">예약 및 상태 관리</h2>
                            <p class="text-[11px] text-gray-500">지정된 날짜의 예약 명단입니다.</p>
                        </div>
                        <input type="date" value="${AppState.selectedDate}" onchange="handleDateChange(event)"
                               class="bg-white border border-gray-200 text-gray-700 rounded-lg p-1.5 text-sm focus:outline-none focus:border-gray-400 shadow-sm">
                    </div>

                    <!-- Card 1: Equipment Status -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-5 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm">인바디 장비 가동 상태</h3>
                            <p class="text-[11px] text-gray-500 mt-1">점검 시 회원 예약이 전면 차단됩니다.</p>
                        </div>
                        <div class="relative inline-block w-12 h-6 cursor-pointer" onclick="toggleEquipmentStatus()">
                            <div class="block w-12 h-6 rounded-full transition-colors duration-300 ${isEquipAvailable ? 'bg-[#e11d48]' : 'bg-gray-200'}"></div>
                            <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300 transform ${isEquipAvailable ? 'translate-x-6' : ''} shadow-sm"></div>
                        </div>
                    </div>

                    <!-- Card 2: Reservations Table -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-5 overflow-hidden">
                        
                        <!-- Table Header -->
                        <div class="grid grid-cols-12 gap-2 pb-2 border-b-2 border-gray-800 text-[10px] font-bold text-gray-500 items-center">
                            <div class="col-span-5">회원정보</div>
                            <div class="col-span-2 text-center">예약상태</div>
                            <div class="col-span-2 text-center">측정상태</div>
                            <div class="col-span-3 text-right">관리</div>
                        </div>

                        <!-- Table Body -->
                        <div class="flex flex-col">
                            ${htmlList}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Initialization ---
        window.onload = () => {
            initMockDB();
            
            // 1분마다 자동 상태 업데이트 (리마인드 및 자동 측정완료 처리)
            setInterval(() => {
                const now = new Date();
                const todayStr = getLocalYYYYMMDD(now);
                
                if (AppState.db[todayStr]) {
                    Object.keys(AppState.db[todayStr]).forEach(time => {
                        const slot = AppState.db[todayStr][time];
                        const [hour, min] = time.split(':').map(Number);
                        const slotTime = new Date(now);
                        slotTime.setHours(hour, min, 0, 0);
                        
                        if (slot.bookingStatus === '예약완료') {
                            // 1. 측정 리마인드 알림 (사용자 본인)
                            if (AppState.isLoggedIn && AppState.role === 'user' && slot.userId === AppState.currentUser.id) {
                                const diffMs = slotTime - now;
                                const diffMins = Math.floor(diffMs / 1000 / 60);
                                const reminderId = `${todayStr}-${time}`;
                                
                                if (diffMins === 60 && !AppState.remindersSent.includes(reminderId)) {
                                    addNotification(`⏰ [측정 리마인드] 오늘 ${time} 인바디 측정이 1시간 남았습니다.`);
                                    showToast(`측정 1시간 전입니다. 늦지 않게 방문해주세요!`);
                                    AppState.remindersSent.push(reminderId);
                                }
                            }

                            // 2. 예약시간이 지나면 자동으로 '측정완료' 변경 (시스템 봇 역할)
                            // 실제 환경이라면 측정 장비 API와 연동되어 측정 데이터가 들어오면 완료 처리 됨.
                            if (now >= slotTime && slot.measureStatus === '측정대기') {
                                slot.measureStatus = '측정완료';
                                // 만약 관리자 화면을 보고 있다면 UI 리렌더링
                                if (AppState.isLoggedIn && AppState.role === 'admin' && AppState.selectedDate === todayStr) {
                                    renderAdminDashboard();
                                }
                            }
                        }
                    });
                }
            }, 60000); 
        };

    </script>
</body>
</html>
